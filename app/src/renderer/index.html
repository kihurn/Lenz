<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'"
    />
    <title>Lenz</title>
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <span class="brand" aria-hidden="true"></span>
        <div class="seg" role="group" aria-label="Model">
          <button type="button" data-speed="fast" title="Smaller model, quicker answers">Fast</button>
          <button type="button" data-speed="accurate" title="Bigger model, better answers">Accurate</button>
        </div>
        <button type="button" class="chip" id="think" aria-pressed="false" title="Reason before answering (slower)">Think</button>
        <button type="button" class="chip" id="search" aria-pressed="false" title="Search the web before answering">Search</button>
        <button type="button" class="chip" id="mode" title="What Lenz sends: Auto picks text or image">Auto</button>
        <span class="spacer"></span>
        <button type="button" class="icon" id="open-settings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" /></svg>
        </button>
        <button type="button" class="icon" id="hide" aria-label="Hide Lenz (Esc)" title="Hide (Esc)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
        </button>
      </header>

      <main id="chat-view" class="view">
        <section class="capture" id="capture" hidden>
          <img id="thumb" alt="Your latest capture" />
          <div class="capture-meta">
            <span id="mode-label"></span>
            <button type="button" class="link-btn" id="recapture">New capture</button>
          </div>
        </section>

        <div class="thread" id="thread" aria-live="polite">
          <div class="empty" id="empty">
            <p>Press <kbd id="hk-capture"></kbd> to capture your screen, or <kbd id="hk-region"></kbd> to select an area.</p>
            <p>Then ask anything about it.</p>
          </div>
        </div>

        <p class="notice" id="notice" hidden></p>

        <div class="actions" id="actions" role="group" aria-label="Quick actions"></div>

        <form class="ask" id="ask-form">
          <textarea id="question" rows="1" placeholder="Ask about your screen…" aria-label="Question"></textarea>
          <button type="submit" class="send" id="send" aria-label="Ask (Enter)" title="Ask (Enter) · ⌘Enter captures first">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" /></svg>
          </button>
          <button type="button" class="stop" id="stop" aria-label="Stop answering" title="Stop" hidden>
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" /></svg>
          </button>
        </form>
      </main>

      <main id="settings-view" class="view settings" hidden></main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
